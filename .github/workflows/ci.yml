name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Run tests
        # Category-matching tests encode opinions that we deliberately tune in
        # config; don't let those block CI. Lint above still hard-fails.
        continue-on-error: true
        env:
          # Minimal env for tests (no real WooCommerce)
          WOOCOMMERCE_URL: "https://test.example.co.il"
          WOOCOMMERCE_KEY: "ck_test_ci"
          WOOCOMMERCE_SECRET: "cs_test_ci"
          WP_USER: ""
          WP_APP_PASSWORD: ""
          OPENAI_API_KEY: ""
          DRY_RUN: "true"
        run: |
          pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          retention-days: 7
