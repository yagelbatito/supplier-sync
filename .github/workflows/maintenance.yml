name: Maintenance (one-off cleanups)

# Runs a chosen maintenance script against the live store. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run (e.g. fix_misplaced_furniture.py, draft_no_image_products.py)"
        required: true
      apply:
        description: "Type 'apply' to write changes (empty = dry-run)"
        required: false
        default: ""

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run maintenance script
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run script
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then
            python -u "${{ github.event.inputs.script }}" --apply
          else
            python -u "${{ github.event.inputs.script }}"
          fi
