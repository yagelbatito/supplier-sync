name: Mailchimp Phone Sync

# Fills the Mailchimp PHONE field from WooCommerce billing phones (the WC plugin
# doesn't sync phone). Runs weekly so new customers' phones get added too.
on:
  schedule:
    - cron: "0 16 * * 6"   # Saturday 16:00 UTC (before the 17:00 sales email)
  workflow_dispatch:

concurrency:
  group: phone-sync
  cancel-in-progress: false

jobs:
  phones:
    name: Sync WooCommerce phones → Mailchimp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync phones
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: python -u sync_phones_to_mailchimp.py
