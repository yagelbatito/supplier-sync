name: Muriel Art Sync

# Uploads priced Muriel Art catalog items (x1.8) as variable/simple products.
# Public data.json + images — only WooCommerce secrets needed. Resumable (skips
# products that already exist by SKU), so it can be re-run until complete.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products (empty = all)"
        required: false
        default: ""

concurrency:
  group: muriel-sync
  cancel-in-progress: false

jobs:
  muriel:
    name: Sync Muriel Art catalog
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Muriel sync
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          LIM="${{ github.event.inputs.limit }}"
          if [ -n "$LIM" ]; then
            python -u muriel_sync.py --apply --limit="$LIM"
          else
            python -u muriel_sync.py --apply
          fi
