name: M.M.S Daily Price Alternate

# Alternates Miki Shaham (M.M.S) prices every day between x1.80 and x1.85,
# recomputed exactly from each product's stored banner price. The multiplier is
# chosen deterministically from the date (even ordinal day -> 1.80, odd -> 1.85),
# so it flips every day and is stable within a day. Runs at 06:00 UTC — AFTER the
# Monday M.M.S full sync (04:00) — so it always sets the correct day's price and
# the weekly sync never leaves a stale value.
on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC
  workflow_dispatch:
    inputs:
      mult:
        description: "Force a multiplier (e.g. 1.80 / 1.85). Empty = auto by date."
        required: false
        default: ""

concurrency:
  group: mms-daily-price
  cancel-in-progress: false

jobs:
  reprice:
    name: Alternate M.M.S price (x1.80 / x1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reprice M.M.S for today
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          M="${{ github.event.inputs.mult }}"
          if [ -z "$M" ]; then
            M=$(python -c "import datetime;print('1.80' if datetime.date.today().toordinal()%2==0 else '1.85')")
          fi
          echo "Today's M.M.S multiplier: $M"
          python -u mms_reprice.py --mult="$M" --apply
