name: Golyan Weekly Sync

# Golyan (גוליאן) moved off WizShop to a public WooCommerce Store API on
# mydgolyan.com. golyan_sync.py fetches from that API and upserts by SKU with
# the phase-1 category mapping (config/golyan_mapping.py), furniture ×0.70 /
# other ×0.75 pricing, OpenAI rewrite + footer, and no supplier name in the
# customer-facing text. Runs in the cloud so it doesn't depend on a laptop.
on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC (~06:00 IL), after the main sync
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products (empty = all)"
        required: false
        default: ""

concurrency:
  group: golyan-sync
  cancel-in-progress: false

jobs:
  golyan:
    name: Sync Golyan (Store API → map → price → upsert)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Golyan sync
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          LIM="${{ github.event.inputs.limit }}"
          if [ -n "$LIM" ]; then
            python -u golyan_sync.py --apply --limit "$LIM"
          else
            python -u golyan_sync.py --apply
          fi
