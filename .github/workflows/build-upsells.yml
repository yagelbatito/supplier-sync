name: Build Upsells (complementary products)

# Set product.upsell_ids ("complementary products" shown below each product page)
# from same-series matches, then same-category fill. Re-runnable after uploads.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type 'apply' to write upsells (empty = dry-run)"
        required: false
        default: ""

concurrency:
  group: build-upsells
  cancel-in-progress: false

jobs:
  upsells:
    name: Set complementary products (upsell_ids)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build upsells
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then
            python -u build_upsells.py --apply
          else
            python -u build_upsells.py
          fi
