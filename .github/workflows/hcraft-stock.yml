name: Home Craft Stock Sync

# Weekly stock refresh for Home Craft (h-craft.co.il) products — every Monday.
# Re-reads Home Craft's live Wix catalog and flips each imported product (and each
# colour variation) to in/out of stock to match. Stock only: never creates,
# deletes, re-prices or rewrites content. Only WooCommerce secrets needed (the Wix
# storefront token is fetched fresh at runtime from the public site).
on:
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: hcraft-stock
  cancel-in-progress: false

jobs:
  hcraft-stock:
    name: Refresh Home Craft stock
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Home Craft stock sync
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: python -u hcraft_stock_sync.py --apply
