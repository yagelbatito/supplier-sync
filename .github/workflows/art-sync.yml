name: ART Judaica Weekly Sync

# ART Judaica (israel-judaica.com) B2B → store. Logs in, fetches the whole
# catalogue, classifies each product by name into the closest existing store
# category, prices at the B2B price ×1.8, and upserts by SKU. Images are
# downloaded through the logged-in session and uploaded to WordPress (the source
# images are hot-link protected). Runs in the cloud.
on:
  schedule:
    - cron: "0 4 * * 2"   # Tuesday 04:00 UTC — a different slot from Golyan
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products (empty = all)"
        required: false
        default: ""

concurrency:
  group: art-sync
  cancel-in-progress: false

jobs:
  art:
    name: Sync ART Judaica (login → fetch → classify → ×1.8 → upsert)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ART sync
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
          IJ_USER: ${{ secrets.IJ_USER }}
          IJ_PASSWORD: ${{ secrets.IJ_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          LIM="${{ github.event.inputs.limit }}"
          if [ -n "$LIM" ]; then
            python -u art_sync.py --apply --limit "$LIM"
          else
            python -u art_sync.py --apply
          fi
