name: Home Craft Import

# Imports Home Craft (h-craft.co.il) chairs / bar chairs / armchairs into WooCommerce
# with GPT-vision description enrichment (tags + SEO), colour variable products, and
# per-colour stock. Pricing: chairs & bar x0.90, armchairs x0.85. Resumable (skips
# existing SKUs), so re-run to pick up failures or newly added Home Craft products.
# Manual only — day-to-day stock is handled by hcraft-stock.yml (Mondays).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products (empty = all)"
        required: false
        default: ""
      no_ai:
        description: "Skip GPT enrichment (true/false)"
        required: false
        default: "false"

concurrency:
  group: hcraft-sync
  cancel-in-progress: false

jobs:
  hcraft:
    name: Import Home Craft catalog
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Home Craft import
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          ARGS="--apply"
          [ "${{ github.event.inputs.no_ai }}" = "true" ] && ARGS="$ARGS --no-ai"
          LIM="${{ github.event.inputs.limit }}"
          [ -n "$LIM" ] && ARGS="$ARGS --limit=$LIM"
          python -u hcraft_sync.py $ARGS
