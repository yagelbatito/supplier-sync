name: Hide M.M.S products (takedown)

# URGENT/on-demand: set all M.M.S products (SKU prefix 'MMS-') to draft, hiding
# them from the storefront. Their prices came out wrong (OCR digit-gluing) and
# their images still show the wholesale-price badge. Reversible. Manual trigger.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type 'apply' to hide (empty = dry-run count)"
        required: false
        default: ""

concurrency:
  group: hide-mms
  cancel-in-progress: false

jobs:
  hide:
    name: Set MMS-* products to draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run takedown
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VERIFY_SSL: "false"
          LOG_LEVEL: "INFO"
        run: |
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then
            python -u hide_mms.py --apply
          else
            python -u hide_mms.py
          fi
